---
schema_version: 1

options:
  getSyntax: True
  exposePODMembers: False
  includeSubfolder: True

datatypes:
  gsftruth::G4MaterialStep:
    Description: "One Geant4 tracker-material step used for GSF truth diagnostics"
    Author: "CEPCSW GSF development"
    Members:
      - std::int32_t trackID // Geant4 track identifier
      - std::int32_t parentID // Geant4 parent-track identifier
      - std::int32_t stepNumber // Geant4 track-local step number
      - std::int32_t pdg // PDG code of the stepped particle
      - std::int32_t charge // rounded particle charge
      - std::int32_t preStepStatus // Geant4 pre-step status
      - std::int32_t postStepStatus // Geant4 post-step status
      - std::int32_t processSubtype // subtype of the process defining the post-step point
      - std::int32_t preVolumeCopyNo // pre-step physical-volume copy number
      - std::int32_t postVolumeCopyNo // post-step physical-volume copy number
      - std::int16_t preSensitive // nonzero when the pre-step volume is sensitive
      - std::int16_t postSensitive // nonzero when the post-step volume is sensitive
      - edm4hep::Vector3d prePosition // pre-step position [mm]
      - edm4hep::Vector3d postPosition // post-step position [mm]
      - edm4hep::Vector3f preMomentum // pre-step momentum [GeV]
      - edm4hep::Vector3f postMomentum // post-step momentum [GeV]
      - float momentumLoss // pre-minus-post momentum magnitude [GeV]
      - float retainedMomentumFraction // post/pre momentum magnitude
      - float preKineticEnergy // pre-step kinetic energy [GeV]
      - float postKineticEnergy // post-step kinetic energy [GeV]
      - float energyDeposit // total deposited energy [GeV]
      - float nonIonizingEnergyDeposit // non-ionizing deposited energy [GeV]
      - float stepLength // Geant4 step length [mm]
      - float materialRadiationLength // pre-step material radiation length [mm]
      - float stepTX0 // step length divided by material radiation length
      - float preTrackLength // accumulated track length at the pre-step point [mm]
      - float postTrackLength // accumulated track length at the post-step point [mm]
      - float preGlobalTime // pre-step global time [ns]
      - float postGlobalTime // post-step global time [ns]

  gsftruth::SimTrackerHitG4StepLink:
    Description: "Exact Geant4 step provenance of one EDM4hep SimTrackerHit"
    Author: "CEPCSW GSF development"
    Members:
      - std::int32_t trackID // Geant4 track identifier
      - std::int32_t firstStepNumber // first contributing Geant4 step
      - std::int32_t lastStepNumber // last contributing Geant4 step
      - std::int32_t hookStepNumber // step containing the SimTrackerHit measurement hook
      - std::int16_t hookKind // 0 unknown, 1 pre-point, 2 post-point, 3 step midpoint, 4 traversal midpoint
      - float hookFraction // fraction from pre to post point in hookStep, or -1 when unresolved
      - std::int16_t provenanceType // 1 per-step, 2 combined traversal, 3 TPC pad row, 4 TPC space point, 5 TPC low-pT accumulation
      - std::int32_t status // provenance validity bit mask
    OneToOneRelations:
      - edm4hep::SimTrackerHit simHit // exact simulated hit created from the transient Geant4 hit
      - gsftruth::G4MaterialStep firstStep // first stored contributing step when available
      - gsftruth::G4MaterialStep lastStep // last stored contributing step when available
      - gsftruth::G4MaterialStep hookStep // stored measurement-hook step when available

  gsftruth::MaterialInterval:
    Description: "Passive truth and runtime material summary for one accepted GSF hit interval"
    Author: "CEPCSW GSF development"
    Members:
      - std::int32_t inputTrackIndex // CompleteTracks index
      - std::int32_t outputTrackIndex // corresponding GSFTracks index, or -1
      - std::int32_t hitFromIndex // inner accepted-hit index
      - std::int32_t hitToIndex // outer accepted-hit index
      - std::int32_t surfaceFromIndex // inner matched measurement-surface index
      - std::int32_t surfaceToIndex // outer matched measurement-surface index
      - std::uint64_t cellFrom // inner accepted-hit cell identifier
      - std::uint64_t cellTo // outer accepted-hit cell identifier
      - std::int32_t truthTrackID // matched primary Geant4 track identifier
      - std::int32_t truthFirstStepNumber // step containing the inner truth hook
      - std::int32_t truthLastStepNumber // step containing the outer truth hook
      - double truthStartHookFraction // inner hook fraction within its step
      - double truthEndHookFraction // outer hook fraction within its step
      - edm4hep::Vector3d truthStartPosition // inner truth hook [mm]
      - edm4hep::Vector3d truthEndPosition // outer truth hook [mm]
      - std::int32_t truthStepCount // positive-length Geant4 step pieces in the interval
      - double truthG4TX0 // fractionally integrated Geant4 step t/X0
      - double truthMomentumBefore // momentum at the inner hook [GeV]
      - double truthEbremLoss // process-subtype-3 momentum loss in the interval [GeV]
      - double truthRetainedMomentumFraction // 1 - truthEbremLoss/truthMomentumBefore
      - std::int16_t dd4hepTruthHookValid // nonzero when the hook-to-hook DD4hep path is valid
      - std::int32_t dd4hepTruthHookLayerCount // material segments between truth hooks
      - double dd4hepTruthHookTX0 // DD4hep t/X0 between the two truth hooks
      - std::int16_t runtimeMaterialMode // 1 CurrentSurface, 2 DD4hepBetweenSurfaces
      - double splitThreshold // configured runtime BH split threshold
      - std::int32_t forwardCandidateCount // forward component paths evaluated
      - std::int32_t forwardValidCount // valid forward component paths
      - std::int32_t forwardAboveThresholdCount // forward paths above split threshold
      - double forwardWeightedTX0 // parent-weighted mean valid forward path t/X0
      - double forwardMinTX0 // minimum valid forward path t/X0
      - double forwardMaxTX0 // maximum valid forward path t/X0
      - std::int32_t forwardLeadingComponentID // highest-parent-weight forward component
      - double forwardLeadingComponentWeight // its parent weight
      - double forwardLeadingTX0 // its runtime path t/X0, or NaN when invalid
      - std::int32_t reverseCandidateCount // reverse component paths evaluated
      - std::int32_t reverseValidCount // valid reverse component paths
      - std::int32_t reverseAboveThresholdCount // reverse paths above split threshold
      - double reverseWeightedTX0 // parent-weighted mean valid reverse path t/X0
      - double reverseMinTX0 // minimum valid reverse path t/X0
      - double reverseMaxTX0 // maximum valid reverse path t/X0
      - std::int32_t reverseLeadingComponentID // highest-parent-weight reverse component
      - double reverseLeadingComponentWeight // its parent weight
      - double reverseLeadingTX0 // its runtime path t/X0, or NaN when invalid
